[project]
name = "forgetools"
version = "0.1.0"
description = "forge's media tools: image generation and edits, ComfyUI jobs with saved records, durable delivery"
requires-python = ">=3.11"
dependencies = ["pillow", "boto3", "requests"]

[project.scripts]
forge = "forgetools.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgetools"]
